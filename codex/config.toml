# プロジェクト配布用設定。<repo>/.codex/config.toml として配置する。
# trusted project でのみ読み込まれ、CLI / profile / user config より優先度は低い。
# 可逆な workspace 内操作は自動化し、不可逆操作は rules の確認か hooks の拒否へ分離する。
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
# shell の outbound network は localhost を含めて遮断し、AGENTS.md の HTTP Request 規約どおり
# 必要なリクエストだけ sandbox 外の承認へ送る。
network_access = false
# workspace-write は writable root 内でも .git / .codex / .agents を再帰的に read-only にする。
# init-agent のような設定変更は、ユーザーが内容を確認して sandbox 外で明示実行する。

[features]
# 現行 Codex では既定で有効だが、配布設定が hooks.json を前提とすることを明示する。
hooks = true

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
startup_timeout_sec = 20

[mcp_servers.serena]
command = "uvx"
args = [
  "--from", "git+https://github.com/oraios/serena",
  "serena", "start-mcp-server",
  "--context", "codex",
  "--project-from-cwd",
]
startup_timeout_sec = 30
